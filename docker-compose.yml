services:
  database:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASS}
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_DB: ${DEV_DB_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DEV_DB_USER}
      DB_PASS: ${DEV_DB_PASS}
      DB_NAME: ${DEV_DB_NAME}
      PORT: 3000
      NODE_ENV: development
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/backend
      - /usr/src/backend/node_modules
      - ./.env:/usr/src/backend/.env
    command: ["sh", "/usr/local/bin/docker-entrypoint.sh"]
