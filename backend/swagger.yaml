        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
      responses:
        201:
          description: Create a review for a request successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReviewResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /request/{id}/proof:
    post:
      summary: Add a photo to a request
      operationId: Request_addProof
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of request
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        201:
          description: Add a photo to a request successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /request:
    post:
      summary: Create a new request
      operationId: Request_create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
      responses:
        201:
          description: Create a new request successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /request/status:
    get:
      summary: Get all request status types
      operationId: Request_getStatus
      responses:
        200:
          description: Get all request status types successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        username: { type: string }
        phone: { type: string }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    UserRequest:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            password: { type: string }
            role: { type: string }

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            role: { type: string }

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            password: { type: string }

    UserAuthentication:
      type: object
      properties:
        message: { type: string }
        token: { type: string }
        role: { type: string }
        name: { type: string }

    UserSignIn:
      type: object
      properties:
        username: { type: string }
        password: { type: string }

    Categories:
      type: object
      description: "A map of category IDs to unit names"
      additionalProperties:
        type: string
      example:
        "1": "thuốc"
        "2": "thực phẩm"
        "3": "nước"
        "4": "vật dụng"
        "5": "tiền"

    CategoriesResponse:
      type: object
      properties:
        message: { type: string }
        categories:
          $ref: '#/components/schemas/Categories'
    
    Units:
      type: object
      description: "A map of unit IDs to unit names"
      additionalProperties:
        type: string
      example:
        "1": "kg"
        "2": "l"
        "3": "phần"
        "4": "cái"
        "5": "nghìn VND"

    BaseEvent:
      type: object
      properties:
        description: { type: string }
        startTime:
          type: string
          format: date-time
          example: "2025-12-28T21:23:27Z"
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        dest_address_line: { type: string }
        dest_ward: { type: string }
        dest_district: { type: string }
        dest_city_province: { type: string }
        plate: { type: string }

    Event:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            id: { type: integer }
            user: { type: string }
            name: { type: integer }
            isCompleted: { type: boolean }
            endTime:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
    
    EventRequest:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            supplies:
              type: array
              items:
                type: integer

    EventsResponse:
      type: object
      properties:
        message: { type: string }
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total_records: { type: integer }

    EventResponse:
      type: object
      properties:
        message: { type: string }
        event:
          allOf:
            - $ref: '#/components/schemas/BaseEvent'
            - type: object
              properties:
                id: { type: integer }
                isCompleted: { type: boolean }
                endTime:
                  type: string
                  format: date-time
                  example: "2025-12-28T21:23:27Z"
                createdAt:
                  type: string
                  format: date-time
                  example: "2025-12-28T21:23:27Z"
                updatedAt:
                  type: string
                  format: date-time
                  example: "2025-12-28T21:23:27Z"
                user:
                  type: object
                  properties:
                    name: { type: string }
                    email: { type: string }
                    phone: { type: string }
                    role: { type: string }
                supplies:
                  type: array
                  items:
                    $ref: '#/components/schemas/Supply'

    
    UnitsResponse:
      type: object
      properties:
        message: { type: string }
        units:
          $ref: '#/components/schemas/Units'

    BaseSupply:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }
        category: { type: integer }
        unit: { type: integer }
        quantity:
          type: number
          format: float
          example: 19.99
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    Supply:
      allOf:
        - $ref: '#/components/schemas/BaseSupply'
        - type: object
          properties:
            id: { type: integer }
            donor: { type: string }
            proof: { type: string }
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"

    SupplyGet:
      allOf:
        - $ref: '#/components/schemas/Supply'
        - type: object
          properties:
            events:
              $ref: '#/components/schemas/Events'

    SupplyGetResponse:
      type: object
      properties:
        message: { type: string }
        supply:
          $ref: '#/components/schemas/SupplyGet'

    SuppliesResponse:
      type: object
      properties:
        message: { type: string }
        supplies:
          type: array
          items:
            $ref: '#/components/schemas/Supply'
        total_records: { type: integer }

    SupplyResponse:
      type: object
      properties:
        message: { type: string }
        supply:
          $ref: '#/components/schemas/Supply'

    SupplyReview:
      allOf:
        - $ref: '#/components/schemas/BaseSupply'
        - type: object
          properties:
            id: { type: integer }
            reviewer: { type: string }
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"

    SupplyReviewResponse:
      type: object
      properties:
        message: { type: string }
        review:
          $ref: '#/components/schemas/SupplyReview'

    SupplyStatus:
      type: object
      description: "A map of IDs to supply status"
      additionalProperties:
        type: string
      example:
        "1": "Chờ xác nhận"
        "2": "Yêu cầu chỉnh sửa"
        "3": "Đang vận chuyển"
        "4": "Chờ giao"
        "5": "Đang giao"
        "6": "Đã giao"

    SupplyStatusResponse:
      type: object
      properties:
        message: { type: string }
        status:
          $ref: '#/components/schemas/SupplyStatus'

    Success:
      type: object
      properties:
        message: { type: string }

    Image:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The image file to upload

    Error:
      type: object
      properties:
        message: { type: string }

    BaseDisaster:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        severity: { type: string }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        type: { type: integer }
        area:
          oneOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
            - $ref: '#/components/schemas/GeoJSONMultiPolygon'
          discriminator:
            propertyName: type
            mapping:
              Polygon: '#/components/schemas/GeoJSONPolygon'
              MultiPolygon: '#/components/schemas/GeoJSONMultiPolygon'

    Disaster:
      allOf:
        - $ref: '#/components/schemas/BaseDisaster'
        - type: object
          properties:
            id: { type: integer }
            user_name: { type: string }
            user_email: { type: string }
            user_phone: { type: string }
            user_role: { type: string }
            center:
              $ref: '#/components/schemas/GeoJSONPoint'
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"

    DisasterResponse:
      type: object
      properties:
        message: { type: string }
        disaster:
          $ref: '#/components/schemas/Disaster'

    Disasters:
      allOf:
        - $ref: '#/components/schemas/BaseDisaster'
        - type: object
          properties:
            id: { type: integer }
            user: { type: string }
            center:
              $ref: '#/components/schemas/GeoJSONPoint'
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"

    DisastersResponse:
      type: object
      properties:
        message: { type: string }
        disasters:
          type: array
          items:
            $ref: '#/components/schemas/Disasters'
        total_records: { type: integer }

    DisasterTypes:
      type: object
      description: "A map of IDs to disaster types"
      additionalProperties:
        type: string
      example:
        "1": "Lũ lụt"
        "2": "Sạt lở"
        "3": "Bão"
        "4": "Hạn hán"

    DisasterTypesResponse:
      type: object
      properties:
        message: { type: string }
        types:
          $ref: '#/components/schemas/DisasterTypes'

    GeoJSONPolygon:
      type: object
      properties:
        type:
          type: string
          enum: [Polygon]
          description: "The geometry type must be Polygon"
        coordinates:
          type: array
          description: "An array of linear rings. The first ring is the exterior boundary."
          items:
            type: array
            description: "A linear ring (array of points). The first and last points must be identical."
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: "[longitude, latitude]"
              example: [103.84, 22.33]
      example:
        type: "Polygon"
        coordinates:
          - - [103.84, 22.33]
            - [103.86, 22.33]
            - [103.86, 22.35]
            - [103.84, 22.35]
            - [103.84, 22.33]

    GeoJSONMultiPolygon:
      type: object
      properties:
        type:
          type: string
          enum: [MultiPolygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }

    GeoJSONPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
          description: "The geometry type must be Point"
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          description: "[longitude, latitude]"
          example: [103.84, 22.33]

    BaseRequest:
      type: object
      properties:
        name: { type: string }
        quantity:
          type: number
          format: float
          example: 19.99
        category: { type: integer }
        unit: { type: integer }
        priority: { type: string }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    Request:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            id: { type: integer }
            status: { type: integer }
            proof: { type: string }
            recipient: { type: string }
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"

    RequestsResponse:
      type: object
      properties:
        message: { type: string }
        requests:
          type: array
          items:
            $ref: '#/components/schemas/Request'

    RequestResponse:
      type: object
      properties:
        message: { type: string }
        request:
          $ref: '#/components/schemas/Request'

    RequestReview:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            id: { type: integer }
            reviewer: { type: string }
            createdAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-12-28T21:23:27Z"
    
    RequestReviewResponse:
      type: object
      properties:
        message: { type: string }
        request:
          $ref: '#/components/schemas/RequestReview'

    RequestStatus:
      type: object
      description: "A map of IDs to request status"
      additionalProperties:
        type: string
      example:
        "1": "Chờ xác nhận"
        "2": "Yêu cầu chỉnh sửa"
        "3": "Đang thực hiện"
        "4": "Đã giao"

    RequestStatusResponse:
      type: object
      properties:
        message: { type: string }
        status:
          $ref: '#/components/schemas/RequestStatus'

    BaseDelivery:
      type: object
      properties:
        