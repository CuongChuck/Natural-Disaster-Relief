openapi: 3.0.0
info:
  title: Natural Disaster Relief System API
  version: 1.0.0
  description: API documentation for Natural Disaster Relief System
servers:
  - url: http://localhost:3000

paths:
  /user/register:
    post:
      summary: Register a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        201:
          description: User signed in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered via jwt strategy successfully"
                  token:
                    type: string
                    description: RS256 JWT token
                  user:
                    $ref: '#/components/schemas/UserResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /user/auth:
    post:
      summary: User login
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                strategy:
                  type: string
      responses:
        201:
          description: User signed in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User signed via jwt strategy successfully"
                  token:
                    type: string
                    description: RS256 JWT token
                  user:
                    $ref: '#/components/schemas/UserResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /categories:
    get:
      summary: Get all categories
      tags:
        - Categories
      responses:
        200:
          description: Get all categories successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Categories retrieved via all strategy successfully"
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /units:
    get:
      summary: Get all units
      tags:
        - Units
      responses:
        200:
          description: Get all units successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Units retrieved via all strategy successfully"
                  units:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unit'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supplies:
    get:
      summary: Get all supply offers
      tags:
        - Supplies
      responses:
        200:
          description: Get all supply offers successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies retrieved via all strategy successfully"
                  supplies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supply:
    post:
      summary: Create a new supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        201:
          description: Create a new supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies created via normal strategy successfully"
                  supply:
                    $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supply/{id}:
    put:
      summary: Edit a supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        201:
          description: Edit a supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies edit via nonAdmin strategy successfully"
                  supply:
                    $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      summary: Delete a supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  type: string
                  example: nonAdmin
      responses:
        204:
          description: Delete a supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies deletion via nonAdmin strategy successfully"
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
        strategy:
          type: string
          example: jwt
        name: { type: string }
        username: { type: string }
        phone: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        role: { type: string }

    UserResponse:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        username: { type: string }
        phone: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        role: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    
    Unit:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    SupplyRequest:
      type: object
      properties:
        strategy:
          type: string
          example: ["normal", "nonAdmin"]
        category: { type: integer }
        unit: { type: integer }
        name: { type: string }
        count: { type: integer }
        quantity:
          type: number
          format: float
          example: 19.99
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    Supply:
      type: object
      properties:
        id: { type: integer }
        Category.name: { type: string }
        Unit.name: { type: string }
        User.username: { type: string }
        name: { type: string }
        count: { type: integer }
        quantity:
          type: number
          format: float
          example: 19.99
        expected_ward: { type: string }
        expected_district: { type: string }
        expected_city_province: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        createdAt:
          type: string
          format: date-time
          example: "2025-12-28T21:23:27Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-12-28T21:23:27Z"