openapi: 3.0.0
info:
  title: Natural Disaster Relief System API
  version: 1.0.0
  description: API documentation for Natural Disaster Relief System
servers:
  - url: http://localhost:3000

paths:
  /user:
    get:
      summary: Get User profile
      tags:
        - Users
      responses:
        201:
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User profile retrieval successfully"
                  user:
                    $ref: '#/components/schemas/User'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    
    put:
      summary: User profile edit
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    password:
                      type: string
      responses:
        200:
          description: User profile edit successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User profile edit successfully"
                  user:
                    $ref: '#/components/schemas/User'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      summary: Delete User
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User deleted successfully"
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /user/register:
    post:
      summary: Register a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        201:
          description: User signed in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  token:
                    type: string
                    description: RS256 JWT token
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /user/auth:
    post:
      summary: User login
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User signed in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User signed in successfully"
                  token:
                    type: string
                    description: RS256 JWT token
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /categories:
    get:
      summary: Get all categories
      tags:
        - Categories
      responses:
        200:
          description: Get all categories successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Categories retrieved successfully"
                  categories:
                    $ref: '#/components/schemas/Category'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /units:
    get:
      summary: Get all units
      tags:
        - Units
      responses:
        200:
          description: Get all units successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Units retrieved successfully"
                  units:
                    $ref: '#/components/schemas/Unit'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supplies/unverified:
    get:
      summary: Get all unverified supply offers
      tags:
        - Supplies
      responses:
        200:
          description: Get all unverified supply offers successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies retrieved successfully"
                  supplies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supplies/me/unverified:
    get:
      summary: Get all current user's unverified supply offers
      tags:
        - Supplies
      security:
        - bearerAuth: []
      responses:
        200:
          description: Get all current user's unverified supply offers successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "My supplies retrieved successfully"
                  supplies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supply/unverified/{id}:
    get:
      summary: Get an unverified supply offers
      tags:
        - Supplies
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      responses:
        200:
          description: Get an unverified supply offers successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supply ID retrieved successfully"
                  supply:
                    $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supply:
    post:
      summary: Create a new supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        201:
          description: Create a new supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supplies created successfully"
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /supply/{id}:
    put:
      summary: Donor edit an unverified supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        201:
          description: Edit a supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supply edition successfully"
                  supply:
                    $ref: '#/components/schemas/Supply'
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      summary: Donor delete an unverified supply offer
      tags:
        - Supplies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of supply offer
          schema:
            type: integer
      responses:
        200:
          description: Delete a supply offer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Supply deletion successfully"
        500:
          description: Error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }
        username: { type: string }
        phone: { type: string }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        role: { type: string }

    User:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        username: { type: string }
        phone: { type: string }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    Category:
      type: object
      description: "A map of category IDs to unit names"
      additionalProperties:
        type: string
      example:
        "1": "thuốc"
        "2": "thực phẩm"
        "3": "nước"
        "4": "vật dụng"
        "5": "tiền"
    
    Unit:
      type: object
      description: "A map of unit IDs to unit names"
      additionalProperties:
        type: string
      example:
        "1": "kg"
        "2": "l"
        "3": "phần"
        "4": "cái"
        "5": "nghìn VND"

    SupplyRequest:
      type: object
      properties:
        category:
          type: string
          example: "1"
        unit:
          type: string
          example: "1"
        name: { type: string }
        count: { type: integer }
        quantity:
          type: number
          format: float
          example: 19.99
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }

    Supply:
      type: object
      properties:
        id: { type: integer }
        category: { type: string }
        unit: { type: string }
        donor: { type: string }
        name: { type: string }
        quantity:
          type: number
          format: float
          example: 19.99
        count: { type: integer }
        address_line: { type: string }
        ward: { type: string }
        district: { type: string }
        city_province: { type: string }
        createdAt:
          type: string
          format: date-time
          example: "2025-12-28T21:23:27Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-12-28T21:23:27Z"