openapi: 3.0.0
info:
  title: Natural Disaster Relief System API
  version: 1.0.0
  description: API documentation for Natural Disaster Relief System
servers:
  - url: http://localhost:3000

paths:
  /user:
    get:
      summary: Get User profile
      security:
        - bearerAuth: []
      operationId: User_getUser
      responses:
        201:
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: User profile edit
      operationId: User_editUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        201:
          description: User profile edit successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete User
      operationId: User_deleteUser
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        500:
          description: Error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

